services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: MS214
      MYSQL_USER: MSServer
      MYSQL_PASSWORD: yellowhammer
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8483:8483"
      - "8484:8484"
      - "8585:8585"
    volumes:
      - ./wz:/server/wz
      - ./dat:/server/dat

volumes:
  mysql_data:
